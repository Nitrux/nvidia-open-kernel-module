name: Build and publish NVIDIA packages.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    container:
      image: debian:testing-20260713-slim
      env:
        DEBIAN_FRONTEND: noninteractive
        PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

    steps:
      - name: Install CA certificates
        run: apt update && apt install --no-install-recommends -y ca-certificates

      - name: Update APT sources and upgrade
        run: |
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/10-no-check-valid-until
          echo 'Acquire::Check-Date "false";' >> /etc/apt/apt.conf.d/10-no-check-valid-until
          cat <<EOF > /etc/apt/sources.list.d/debian.sources
          Types: deb
          URIs: https://snapshot.debian.org/archive/debian/20261105T143010Z
          Suites: testing
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          Architectures: amd64
          EOF
          apt update
          apt full-upgrade -y
          apt install --no-install-recommends -y -o Dpkg::Options::=--force-overwrite curl gnupg
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packagecloud.io/nitrux/testing/gpgkey -o /tmp/nitrux-testing.gpgkey
          gpg --dearmor --yes -o /etc/apt/keyrings/nitrux-testing.gpg /tmp/nitrux-testing.gpgkey
          chmod 0644 /etc/apt/keyrings/nitrux-testing.gpg
          echo 'deb [signed-by=/etc/apt/keyrings/nitrux-testing.gpg] https://packagecloud.io/nitrux/testing/debian/ duke main' > /etc/apt/sources.list.d/nitrux.list
          apt update
          apt update && apt full-upgrade -y

      - name: Setup amd64 environment
        run: apt install --no-install-recommends -y build-essential devscripts equivs git gnupg lintian ruby-full sudo

      - name: Install PackageCloud client
        run: gem install --no-document package_cloud

      - uses: actions/checkout@v4

      - name: Install matching kernel and headers
        run: |
          apt install --no-install-recommends -y -o Dpkg::Options::=--force-overwrite \
            linux-image-$(tr -d '[:space:]' < VERSION) \
            linux-headers-$(tr -d '[:space:]' < VERSION)

      - name: Build NVIDIA package set
        run: ./gh-build.sh

      - name: Remove existing packages
        run: |
          for package in output/*.deb; do
            package_cloud yank nitrux/nvidia/debian/duke "$(basename "$package")" || echo "Package not present in PackageCloud; continuing."
          done

      - name: Push packages
        run: package_cloud push nitrux/nvidia/debian/duke output/*.deb

  build-arm64:
    if: ${{ false }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    container:
      image: arm64v8/debian:testing-20260713-slim
      env:
        DEBIAN_FRONTEND: noninteractive
        PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

    steps:
      - name: Install CA certificates
        run: apt update && apt install --no-install-recommends -y ca-certificates

      - name: Update APT sources and upgrade
        run: |
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/10-no-check-valid-until
          echo 'Acquire::Check-Date "false";' >> /etc/apt/apt.conf.d/10-no-check-valid-until
          cat <<EOF > /etc/apt/sources.list.d/debian.sources
          Types: deb
          URIs: https://snapshot.debian.org/archive/debian/20261105T143010Z
          Suites: testing
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          Architectures: arm64
          EOF
          apt update
          apt full-upgrade -y
          apt install --no-install-recommends -y -o Dpkg::Options::=--force-overwrite curl gnupg
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packagecloud.io/nitrux/testing/gpgkey -o /tmp/nitrux-testing.gpgkey
          gpg --dearmor --yes -o /etc/apt/keyrings/nitrux-testing.gpg /tmp/nitrux-testing.gpgkey
          chmod 0644 /etc/apt/keyrings/nitrux-testing.gpg
          echo 'deb [signed-by=/etc/apt/keyrings/nitrux-testing.gpg] https://packagecloud.io/nitrux/testing/debian/ duke main' > /etc/apt/sources.list.d/nitrux.list
          apt update
          apt update && apt full-upgrade -y

      - name: Setup arm64 environment
        run: apt install --no-install-recommends -y build-essential devscripts equivs git gnupg lintian ruby-full sudo

      - name: Install PackageCloud client
        run: gem install --no-document package_cloud

      - uses: actions/checkout@v4

      - name: Install matching kernel and headers
        run: |
          apt install --no-install-recommends -y -o Dpkg::Options::=--force-overwrite \
            linux-image-$(tr -d '[:space:]' < VERSION) \
            linux-headers-$(tr -d '[:space:]' < VERSION)

      - name: Build NVIDIA package set
        run: ./gh-build.sh

      - name: Remove existing packages
        run: |
          for package in output/*.deb; do
            package_cloud yank nitrux/nvidia/debian/duke "$(basename "$package")" || echo "Package not present in PackageCloud; continuing."
          done

      - name: Push packages
        run: package_cloud push nitrux/nvidia/debian/duke output/*.deb
